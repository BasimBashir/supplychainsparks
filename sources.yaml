# kind: rss  -> url is a feed URL. kind: html -> url is a listing page; link_pattern
# is a regex the href must match (re.search) to count as an article link.
#
# Every feed below was verified reachable with the app's bot user agent and
# allowed by the site's robots.txt (2026-09-09). Google News RSS and several
# regional feeds (Arab News, Logistics Middle East, Gulf News, Mawani) were
# removed: they robots-block or 403/405 non-browser agents, so they produced
# zero items every cycle.
